<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>2 + 3 = 5</title>
  <style>
    html, body { margin: 0; background: #fff; color: #111; }
    pre { margin: 16px; font: 16px/1.4 sans-serif; }
  </style>
</head>
<body>
  <pre id="readme"></pre>
  <script>
    fetch("README.md").then(function (response) { return response.text(); }).then(function (text) {
      document.getElementById("readme").textContent = text;
    });
  </script>
</body>
</html>
